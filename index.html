<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubVerse 3D V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111827;font-family:Arial,sans-serif;color:white}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827d9;border:1px solid #ffffff30;border-radius:14px;padding:12px}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#coins{font-size:18px;font-weight:bold;color:#ffd84d}
#zone{font-size:13px;color:#cbd5e1;margin-top:5px}
#help{position:absolute;top:105px;left:12px;font-size:12px;max-width:230px}
#message{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:23px;font-weight:bold;text-align:center;text-shadow:0 3px 8px #000}
#bottom{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
button{pointer-events:auto;border:0;border-radius:12px;padding:12px 15px;background:#7c3aed;color:white;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #4c1d95}
button:active{transform:translateY(3px);box-shadow:none}
#actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#joystick{width:110px;height:110px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none}
#knob{width:42px;height:42px;border-radius:50%;background:#ffffffb5;position:absolute;left:32px;top:32px}
#jump{width:70px;height:70px;border-radius:50%;background:#06b6d4;box-shadow:0 4px 0 #0e7490}
#mobileControls{display:none;gap:12px;align-items:end}
#colorMenu{display:none;position:absolute;bottom:115px;right:12px;pointer-events:auto}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid white;display:inline-block;margin:4px;cursor:pointer}
@media(max-width:700px){
 #help{display:none}
 #mobileControls{display:flex}
 #top{font-size:13px}
 #bottom{bottom:12px}
 button{padding:11px;font-size:12px}
}
</style>
</head>
<body>
<div id="ui">
 <div id="top">
  <div class="panel">
   <strong>🌌 CLUBVERSE 3D</strong>
   <div id="zone">Zone : Lobby</div>
  </div>
  <div class="panel"><div id="coins">🪙 0 pièces</div><div id="score">⭐ Niveau 1</div></div>
 </div>
 <div id="help" class="panel">
  <b>COMMANDES</b><br>
  ZQSD / WASD : bouger<br>
  ESPACE : sauter<br>
  E : entrer dans un portail<br>
  Souris : tourner la caméra<br>
  Ramasse les pièces dorées !
 </div>
 <div id="message"></div>
 <div id="bottom">
  <div id="mobileControls">
   <div id="joystick"><div id="knob"></div></div>
   <button id="jump">SAUT</button>
  </div>
  <div id="actions">
   <button id="portalBtn">🌀 Portail</button>
   <button id="colorBtn">🎨 Avatar</button>
  </div>
 </div>
 <div id="colorMenu" class="panel">
  <div class="swatch" data-color="#a855f7" style="background:#a855f7"></div>
  <div class="swatch" data-color="#22d3ee" style="background:#22d3ee"></div>
  <div class="swatch" data-color="#fb7185" style="background:#fb7185"></div>
  <div class="swatch" data-color="#4ade80" style="background:#4ade80"></div>
  <div class="swatch" data-color="#facc15" style="background:#facc15"></div>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#87ceeb');
scene.fog = new THREE.Fog('#87ceeb', 35, 100);

const camera = new THREE.PerspectiveCamera(
 70, innerWidth / innerHeight, 0.1, 200
);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526080,2));
const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(10,20,8);
sun.castShadow = true;
scene.add(sun);

const uiCoins = document.querySelector('#coins');
const uiZone = document.querySelector('#zone');
const uiScore = document.querySelector('#score');
const message = document.querySelector('#message');

let coins = 0;
let level = 1;
let currentZone = 'Lobby';
let jumpSpeed = 0;
let grounded = true;
let worldItems = [];
let portals = [];
let obstacles = [];
let coinMeshes = [];
let color = '#a855f7';
let messageTimer = 0;

const player = new THREE.Group();
scene.add(player);

const bodyMat = new THREE.MeshStandardMaterial({color:color,roughness:0.5});
const body = new THREE.Mesh(
 new THREE.CapsuleGeometry(0.42,0.65,5,10), bodyMat
);
body.position.y = 0.85;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
 new THREE.SphereGeometry(0.34,20,16),
 new THREE.MeshStandardMaterial({color:0xffd6b0})
);
head.position.y = 1.55;
head.castShadow = true;
player.add(head);

const eyeMat = new THREE.MeshStandardMaterial({color:0x172033});
for(const x of [-0.12,0.12]){
 const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8),eyeMat);
 eye.position.set(x,1.59,-0.29);
 player.add(eye);
}

const floorMat = new THREE.MeshStandardMaterial({color:0x334155});
const floor = new THREE.Mesh(new THREE.BoxGeometry(100,1,100),floorMat);
floor.position.y = -0.55;
floor.receiveShadow = true;
scene.add(floor);

function box(x,y,z,sx,sy,sz,colorValue,collide=true){
 const mesh = new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),
  new THREE.MeshStandardMaterial({color:colorValue,roughness:0.7})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow = true;
 mesh.receiveShadow = true;
 scene.add(mesh);
 worldItems.push(mesh);
 if(collide) obstacles.push({x,z,sx,sz,sy,y});
 return mesh;
}

function makeCoin(x,z){
 const coin = new THREE.Mesh(
  new THREE.TorusGeometry(0.35,0.11,10,20),
  new THREE.MeshStandardMaterial({
   color:0xffd43b,emissive:0x8a5a00,metalness:0.65,roughness:0.25
  })
 );
 coin.position.set(x,1.15,z);
 coin.castShadow = true;
 scene.add(coin);
 coinMeshes.push(coin);
}

function makePortal(x,z,label,portalColor,target){
 const group = new THREE.Group();
 group.position.set(x,1.5,z);
 const ring = new THREE.Mesh(
  new THREE.TorusGeometry(1.15,0.18,12,36),
  new THREE.MeshStandardMaterial({
   color:portalColor,emissive:portalColor,emissiveIntensity:0.65
  })
 );
 group.add(ring);
 const center = new THREE.Mesh(
  new THREE.CircleGeometry(1.02,32),
  new THREE.MeshBasicMaterial({
   color:portalColor,transparent:true,opacity:0.24,
   side:THREE.DoubleSide
  })
 );
 center.position.z = -0.04;
 group.add(center);
 scene.add(group);
 portals.push({group,x,z,label,target});
 const sign = box(x,3.25,z,2.6,0.35,0.2,portalColor,false);
 return group;
}

function clearWorld(){
 for(const item of worldItems) scene.remove(item);
 for(const coin of coinMeshes) scene.remove(coin);
 for(const portal of portals) scene.remove(portal.group);
 worldItems=[];
 coinMeshes=[];
 portals=[];
 obstacles=[];
}

function buildLobby(){
 currentZone='Lobby';
 scene.background.set('#87ceeb');
 scene.fog.color.set('#87ceeb');
 floor.material.color.set('#334155');
 box(0,0,0,12,0.3,12,0x475569);
 // Décoration autour de la place
 for(let i=0;i<12;i++){
  const a=i*Math.PI/6;
  const x=Math.cos(a)*11;
  const z=Math.sin(a)*11;
  box(x,1,z,1,2,1,0x64748b,false);
 }
 makePortal(-5,0,'PARCOURS',0xa855f7,'Parcours');
 makePortal(0,-5,'PLAGE',0x06b6d4,'Plage');
 makePortal(5,0,'JARDIN',0x22c55e,'Jardin');
 for(const [x,z] of [[-3,3],[3,3],[0,4],[-3,-3],[3,-3]]){
  makeCoin(x,z);
 }
 player.position.set(0,0,4);
}

function buildParcours(){
 currentZone='Parcours';
 scene.background.set('#241442');
 scene.fog.color.set('#241442');
 floor.material.color.set('#25143f');
 box(0,0,-5,7,0.5,7,0x6d28d9);
 box(0,1,-10,4,0.5,4,0x9333ea);
 box(3,2,-15,4,0.5,4,0xc084fc);
 box(-1,3,-20,5,0.5,4,0x7c3aed);
 box(-1,0,-25,10,0.5,7,0x4c1d95);
 makePortal(0,0,'RETOUR',0x06b6d4,'Lobby');
 for(let i=0;i<12;i++){
  makeCoin((i%3-1)*2,-7-Math.floor(i/3)*4);
 }
 player.position.set(0,0,0);
}

function buildBeach(){
 currentZone='Plage';
 scene.background.set('#4cc9f0');
 scene.fog.color.set('#4cc9f0');
 floor.material.color.set('#f5d38b');
 box(0,-0.1,-8,28,0.25,18,0xfde68a,false);
 const water = new THREE.Mesh(
  new THREE.BoxGeometry(28,0.2,20),
  new THREE.MeshStandardMaterial({color:0x0891b2,roughness:0.3})
 );
 water.position.set(0,-0.35,-23);
 scene.add(water);
 worldItems.push(water);
 for(let i=0;i<8;i++) makeCoin(-7+i*2,-5-(i%3)*3);
 makePortal(0,2,'RETOUR',0xa855f7,'Lobby');
 player.position.set(0,0,0);
}

function buildGarden(){
 currentZone='Jardin';
 scene.background.set('#a7f3d0');
 scene.fog.color.set('#a7f3d0');
 floor.material.color.set('#15803d');
 for(let i=0;i<14;i++){
  const x=(i%7-3)*3;
  const z=-Math.floor(i/7)*8-4;
  const trunk=box(x,1,z,0.5,2,0.5,0x854d0e,false);
  const leaves=new THREE.Mesh(
   new THREE.SphereGeometry(1.3,12,10),
   new THREE.MeshStandardMaterial({color:0x22c55e})
  );
  leaves.position.set(x,2.8,z);
  leaves.castShadow=true;
  scene.add(leaves);
  worldItems.push(leaves);
 }
 for(let i=0;i<10;i++) makeCoin(-6+i*1.3,-6-(i%2)*5);
 makePortal(0,2,'RETOUR',0xa855f7,'Lobby');
 player.position.set(0,0,0);
}

function buildZone(zone){
 clearWorld();
 if(zone==='Parcours') buildParcours();
 else if(zone==='Plage') buildBeach();
 else if(zone==='Jardin') buildGarden();
 else buildLobby();
 uiZone.textContent='Zone : '+currentZone;
 message.textContent='Bienvenue : '+currentZone+' !';
 messageTimer=1.8;
}

buildLobby();

const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space'){
  e.preventDefault();
  jump();
 }
 if(e.key.toLowerCase()==='e') usePortal();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function jump(){
 if(grounded){
  jumpSpeed=8;
  grounded=false;
 }
}
document.querySelector('#jump').addEventListener('pointerdown',jump);

let joystickX=0,joystickY=0;
const joystick=document.querySelector('#joystick');
const knob=document.querySelector('#knob');
let joyPointer=null;

joystick.addEventListener('pointerdown',e=>{
 joyPointer=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveJoy(e);
});
joystick.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPointer) moveJoy(e);
});
function moveJoy(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy);
 if(len>32){dx=dx/len*32;dy=dy/len*32;}
 joystickX=dx/32;
 joystickY=dy/32;
 knob.style.left=(32+dx)+'px';
 knob.style.top=(32+dy)+'px';
}
function resetJoy(){
 joyPointer=null;
 joystickX=0;
 joystickY=0;
 knob.style.left='32px';
 knob.style.top='32px';
}
joystick.addEventListener('pointerup',resetJoy);
joystick.addEventListener('pointercancel',resetJoy);

let cameraAngle=0;
let cameraPitch=0.25;
let dragging=false;
let lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){
  dragging=true;lastX=e.clientX;lastY=e.clientY;
 }
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
 if(!dragging)return;
 cameraAngle-=(e.clientX-lastX)*0.006;
 cameraPitch=Math.max(-0.15,Math.min(0.8,cameraPitch+(e.clientY-lastY)*0.003));
 lastX=e.clientX;lastY=e.clientY;
});

function usePortal(){
 let closest=null,dist=Infinity;
 for(const p of portals){
  const d=Math.hypot(player.position.x-p.x,player.position.z-p.z);
  if(d<dist){dist=d;closest=p;}
 }
 if(closest && dist<4){
  buildZone(closest.target);
 }else{
  message.textContent='Approche-toi d’un portail !';
  messageTimer=1.4;
 }
}
document.querySelector('#portalBtn').addEventListener('click',usePortal);

document.querySelector('#colorBtn').addEventListener('click',()=>{
 const menu=document.querySelector('#colorMenu');
 menu.style.display=menu.style.display==='block'?'none':'block';
});
document.querySelectorAll('.swatch').forEach(el=>{
 el.addEventListener('click',()=>{
  color=el.dataset.color;
  bodyMat.color.set(color);
  document.querySelector('#colorMenu').style.display='none';
  message.textContent='Avatar personnalisé !';
  messageTimer=1.3;
 });
});

function blocked(x,z){
 for(const o of obstacles){
  const minX=o.x-o.sx/2-0.45;
  const maxX=o.x+o.sx/2+0.45;
  const minZ=o.z-o.sz/2-0.45;
  const maxZ=o.z+o.sz/2+0.45;
  if(x>minX&&x<maxX&&z>minZ&&z<maxZ&&o.sy>1.2) return true;
 }
 return false;
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.04);

 let forward=0,side=0;
 if(keys['w']||keys['z']||keys['arrowup']) forward+=1;
 if(keys['s']||keys['arrowdown']) forward-=1;
 if(keys['d']||keys['arrowright']) side+=1;
 if(keys['a']||keys['q']||keys['arrowleft']) side-=1;
 forward-=joystickY;
 side+=joystickX;

 const length=Math.hypot(forward,side);
 if(length>1){forward/=length;side/=length;}

 const speed=7;
 const dx=(Math.sin(cameraAngle)*forward+Math.cos(cameraAngle)*side)*speed*dt;
 const dz=(-Math.cos(cameraAngle)*forward+Math.sin(cameraAngle)*side)*speed*dt;

 const nx=player.position.x+dx;
 const nz=player.position.z+dz;
 if(!blocked(nx,player.position.z)) player.position.x=nx;
 if(!blocked(player.position.x,nz)) player.position.z=nz;

 if(length>0.1) player.rotation.y=Math.atan2(dx,dz);

 player.position.y+=jumpSpeed*dt;
 jumpSpeed-=20*dt;
 if(player.position.y<=0){
  player.position.y=0;
  jumpSpeed=0;
  grounded=true;
 }

 // Ramassage des pièces
 for(let i=coinMeshes.length-1;i>=0;i--){
  const c=coinMeshes[i];
  c.rotation.y+=dt*2;
  c.position.y=1.15+Math.sin(performance.now()*0.003+i)*0.12;
  if(player.position.distanceTo(c.position)<1.25){
   scene.remove(c);
   coinMeshes.splice(i,1);
   coins++;
   level=1+Math.floor(coins/10);
   uiCoins.textContent='🪙 '+coins+' pièces';
   uiScore.textContent='⭐ Niveau '+level;
   message.textContent='+1 pièce !';
   messageTimer=0.7;
  }
 }

 for(const p of portals) p.group.rotation.y=Math.sin(performance.now()*0.001)*0.15;

 // Caméra troisième personne
 const distance=7;
 const target=new THREE.Vector3(
  player.position.x+Math.sin(cameraAngle)*distance*Math.cos(cameraPitch),
  player.position.y+3.1+Math.sin(cameraPitch)*distance,
  player.position.z+Math.cos(cameraAngle)*distance*Math.cos(cameraPitch)
 );
 camera.position.lerp(target,0.12);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0) message.textContent='';
 }
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
